name: build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af > /dev/null || true
          df -h /

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio lz4 zstd ccache kmod python3 \
            clang-19 lld-19 llvm-19
          /usr/lib/llvm-19/bin/clang --version | head -1

      - name: Sources
        run: bash scripts/fetch.sh

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build GKI kernel
        run: bash scripts/build_gki.sh

      - name: Build SoC modules (sun)
        id: soc
        continue-on-error: true
        run: bash scripts/build_soc.sh

      - name: Build techpack modules (sun)
        id: tp
        continue-on-error: true
        run: bash scripts/build_tp.sh

      - name: Build OnePlus boot modules
        id: oplus
        continue-on-error: true
        run: bash scripts/build_oplus.sh

      - name: Build OnePlus extra modules (touch)
        id: extra
        continue-on-error: true
        run: bash scripts/build_extra.sh

      - name: Build every other OnePlus driver (from OnePlus' Bazel definitions)
        id: vendor
        continue-on-error: true
        run: bash scripts/build_vendor.sh

      - name: Boot image
        id: bootimg
        continue-on-error: true
        run: bash scripts/build_bootimg.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.run_id }}

      - name: Collect
        if: always()
        run: |
          ccache -s || true
          mkdir -p dist/gki dist/soc dist/logs
          cp out/gki/arch/arm64/boot/Image out/gki/.config out/gki/Module.symvers \
            out/gki/include/config/kernel.release dist/gki/ 2>/dev/null || true
          [ -d out/gki-staging ] && cp -r out/gki-staging dist/gki/ || true
          find src/soc -name '*.ko' -exec cp {} dist/soc/ \; 2>/dev/null || true
          cp src/soc/Module.symvers dist/soc/ 2>/dev/null || true
          mkdir -p dist/tp && cp out/tpmods/*.ko dist/tp/ 2>/dev/null || true
          cp -r out/tp-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/oplus && cp out/oplusmods/*.ko dist/oplus/ 2>/dev/null || true
          cp -r out/oplus-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/extra && cp out/extramods/*.ko dist/extra/ 2>/dev/null || true
          cp -r out/extra-log dist/logs/ 2>/dev/null || true
          mkdir -p dist/vendor && cp out/vendormods/*.ko dist/vendor/ 2>/dev/null || true
          cp -r out/vendor-log dist/logs/ 2>/dev/null || true
          cp out/vendor/modules.json out/vendor/plan.txt dist/logs/ 2>/dev/null || true
          cp -r out/boot/full dist/logs/full-lists 2>/dev/null || true
          cp out/*.log out/*.txt dist/logs/ 2>/dev/null || true
          cp out/soc-kconfig/.config dist/logs/soc.config 2>/dev/null || true
          cp out/boot/*.img dist/ 2>/dev/null || true
          cp out/boot/*.txt out/boot/*.log out/boot/depmod.err dist/logs/ 2>/dev/null || true
          cp -r out/boot/stage/rd/lib/modules dist/layer-modules 2>/dev/null && rm -f dist/layer-modules/*.ko || true
          echo "soc modules: $(ls dist/soc/*.ko 2>/dev/null | wc -l), techpack modules: $(ls dist/tp/*.ko 2>/dev/null | wc -l)"
          du -sh dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op13-618-${{ github.run_number }}
          path: dist/
          retention-days: 14
